<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 420px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e5e5;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        h2 {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        p.sub {
            font-size: 13px;
            color: #999;
            margin-bottom: 32px;
        }

        .button-group {
            display: none;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 0.3s ease;
        }

        button, .link-btn {
            padding: 10px 28px;
            font-size: 14px;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            background-color: #fff;
            color: #333;
            transition: all 0.2s ease;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .link-btn:hover {
            background-color: #333;
            color: #fff;
        }

        .manual-trigger {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .manual-trigger:hover {
            color: #333;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="auto-box">
            <div class="status-icon"></div>
            <h2 id="status-text">正在检测语言偏好...</h2>
            <p class="sub" id="sub-text">根据您的浏览器设置自动跳转</p>
            <div class="manual-trigger" onclick="showManual()">手动选择语言 / Manual selection</div>
        </div>

        <div class="button-group" id="manual-box">
            <a class="link-btn" href="introduction_zh.pdf">阅读中文</a>
            <a class="link-btn" href="introduction_en.pdf">Read English</a>
        </div>
    </div>

    <script>
        function detect() {
            // 1. 浏览器语言
            const lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            // 2. 系统时区
            const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();

            // 判断是否为中文环境
            const isChinese = lang.startsWith('zh') || 
                              ['asia/shanghai', 'asia/chongqing', 'asia/urumqi', 
                               'asia/hong_kong', 'asia/taipei', 'asia/macau'].includes(tz);

            const statusText = document.getElementById('status-text');
            const subText = document.getElementById('sub-text');

            if (isChinese) {
                statusText.textContent = '检测到中文环境，正在跳转...';
                subText.textContent = '若未自动跳转，请点击下方手动选择';
                setTimeout(() => {
                    location.replace('introduction_zh.pdf');
                }, 1000);
            } else {
                statusText.textContent = 'English environment detected. Redirecting...';
                subText.textContent = 'If not redirected, please select manually below';
                setTimeout(() => {
                    location.replace('introduction_en.pdf');
                }, 1000);
            }
        }

        function showManual() {
            document.getElementById('auto-box').style.display = 'none';
            const manual = document.getElementById('manual-box');
            manual.style.display = 'flex';
        }

        // 页面加载后立即检测
        detect();
    </script>

</body>
</html>
